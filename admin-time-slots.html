<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khung giờ - AutoWash Pro</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="admin-time-slots">
<div class="app-layout">
  <div class="sidebar-overlay"></div>
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="sidebar-logo">🚿 Auto<span>Wash</span> Pro</a>
      <div class="sidebar-role">Quản trị</div>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="admin-dashboard.html" class=""><span class="nav-icon">📊</span>Dashboard</a></li>
        <li><a href="admin-customers.html" class=""><span class="nav-icon">👥</span>Khách hàng</a></li>
        <li><a href="admin-bookings.html" class=""><span class="nav-icon">📅</span>Bookings</a></li>
        <li><a href="admin-services.html" class=""><span class="nav-icon">🔧</span>Dịch vụ</a></li>
        <li><a href="admin-time-slots.html" class="active"><span class="nav-icon">⏰</span>Khung giờ</a></li>
        <li><a href="admin-loyalty-tiers.html" class=""><span class="nav-icon">🏆</span>Hạng TV</a></li>
        <li><a href="admin-promotions.html" class=""><span class="nav-icon">🎁</span>Khuyến mãi</a></li>
        <li><a href="admin-analytics.html" class=""><span class="nav-icon">📈</span>Analytics</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <a href="#" onclick="logout();return false">🚪 Đăng xuất</a>
    </div>
  </aside>

  <main class="main-content">
    <header class="navbar">
      <div class="navbar-left">
        <button type="button" class="sidebar-toggle" aria-label="Menu">☰</button>
        <div class="navbar-title"><h2>Khung giờ</h2></div>
      </div>
      <div class="navbar-right">
        <div class="navbar-user">
          <div class="user-avatar">NA</div>
          <div class="user-info">
            <div class="user-name">User</div>
            <div class="user-tier">Member</div>
          </div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h2>Khung giờ làm việc</h2>
        <button class="btn btn-primary" onclick="showAddTimeSlotModal()">+ Thêm khung giờ</button>
      </div>

      <div class="card table-wrapper">
        <table class="table" id="timeslotsTable">
          <thead>
            <tr>
              <th>Tên</th>
              <th>Giờ bắt đầu</th>
              <th>Giờ kết thúc</th>
              <th>Dung tích</th>
              <th>Trạng thái</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Modal for Add/Edit Time Slot -->
      <div class="modal-overlay" id="timeslotModal">
        <div class="modal">
          <div class="modal-header">
            <h3 class="modal-title">Thêm khung giờ</h3>
            <button class="modal-close" data-modal-close>&times;</button>
          </div>
          <form id="timeslotForm">
            <div class="modal-body">
              <div class="form-group">
                <label>Tên khung giờ</label>
                <input type="text" id="slotName" placeholder="VD: Ca Sáng 1" required>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>Giờ bắt đầu</label>
                  <input type="time" id="slotStartTime" required>
                </div>
                <div class="form-group">
                  <label>Giờ kết thúc</label>
                  <input type="time" id="slotEndTime" required>
                </div>
              </div>

              <div class="form-group">
                <label>Dung tích tối đa</label>
                <input type="number" id="slotMaxCapacity" min="1" value="4" required>
              </div>

              <div class="form-group">
                <label>Trạng thái</label>
                <select id="slotIsActive">
                  <option value="true">Active</option>
                  <option value="false">Inactive</option>
                </select>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-modal-close>Hủy</button>
              <button type="submit" class="btn btn-primary">Lưu</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/mock-api.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/time-slots.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
