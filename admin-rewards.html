<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quà tặng - AutoWash Pro</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body data-page="admin-rewards">
    <div class="app-layout">
      <div class="sidebar-overlay"></div>
      <aside class="sidebar">
        <div class="sidebar-header">
          <a href="index.html" class="sidebar-logo"
            >🚿 Auto<span>Wash</span> Pro</a
          >
          <div class="sidebar-role">Quản trị</div>
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="admin-dashboard.html" class=""
                ><span class="nav-icon">📊</span>Dashboard</a
              >
            </li>
            <li>
              <a href="admin-customers.html" class=""
                ><span class="nav-icon">👥</span>Khách hàng</a
              >
            </li>
            <li>
              <a href="admin-bookings.html" class=""
                ><span class="nav-icon">📅</span>Bookings</a
              >
            </li>
            <li>
              <a href="admin-services.html" class=""
                ><span class="nav-icon">🔧</span>Dịch vụ</a
              >
            </li>
            <li>
              <a href="admin-loyalty-tiers.html" class=""
                ><span class="nav-icon">🏆</span>Hạng TV</a
              >
            </li>
            <li>
              <a href="admin-promotions.html" class=""
                ><span class="nav-icon">🎁</span>Khuyến mãi</a
              >
            </li>
            <li>
              <a href="admin-rewards.html" class="active"
                ><span class="nav-icon">🎖️</span>Quà tặng</a
              >
            </li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <a
            href="#"
            onclick="
              logout();
              return false;
            "
            >🚪 Đăng xuất</a
          >
        </div>
      </aside>
      <main class="main-content">
        <header class="navbar">
          <div class="navbar-left">
            <button type="button" class="sidebar-toggle" aria-label="Menu">
              ☰
            </button>
            <div class="navbar-title"><h2>Quà tặng</h2></div>
          </div>
          <div class="navbar-right">
            <div class="navbar-user">
              <div class="user-avatar">NA</div>
              <div class="user-info">
                <div class="user-name">User</div>
                <div class="user-tier">Manager</div>
              </div>
            </div>
          </div>
        </header>
        <div class="page-content">
          <div class="page-header">
            <h2>Reward Catalog</h2>
            <button class="btn btn-primary" onclick="openAddReward()">
              + Thêm quà
            </button>
          </div>
          <div class="card table-wrapper">
            <table class="table" id="rewardsTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên quà</th>
                  <th>Mô tả</th>
                  <th>Điểm đổi</th>
                  <th>Giảm giá</th>
                  <th>Tồn kho</th>
                  <th>Trạng thái</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="modal-overlay" id="rewardModal">
            <div class="modal">
              <div class="modal-header">
                <h3 id="rewardModalTitle">Thêm quà tặng</h3>
                <button class="modal-close" data-modal-close="rewardModal">
                  &times;
                </button>
              </div>
              <form id="rewardForm">
                <div class="modal-body">
                  <input type="hidden" id="rewardId" />
                  <div class="form-group">
                    <label for="rewardName">Tên quà</label
                    ><input type="text" id="rewardName" required />
                  </div>
                  <div class="form-group">
                    <label for="rewardDescription">Mô tả</label
                    ><textarea id="rewardDescription"></textarea>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label for="rewardPoints">Điểm cần đổi</label
                      ><input
                        type="number"
                        id="rewardPoints"
                        min="1"
                        required
                      />
                    </div>
                    <div class="form-row">
                      <div class="form-group">
                        <label for="rewardDiscountType">Loại giảm</label>
                        <select id="rewardDiscountType">
                          <option value="percent">%</option>
                          <option value="fixed">Cố định (đ)</option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="rewardDiscount">Giá trị giảm</label>
                        <input
                          type="number"
                          id="rewardDiscount"
                          min="0"
                          required
                        />
                      </div>
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label for="rewardStock">Tồn kho</label
                      ><input type="number" id="rewardStock" min="0" required />
                    </div>
                    <div class="form-group">
                      <label for="rewardActive">Trạng thái</label>
                      <select id="rewardActive">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-modal-close="rewardModal"
                  >
                    Hủy</button
                  ><button type="submit" class="btn btn-primary">Lưu</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/mock-api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
