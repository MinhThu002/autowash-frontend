<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khách hàng - AutoWash Pro</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body data-page="admin-customers">
    <div class="app-layout">
      <div class="sidebar-overlay"></div>
      <aside class="sidebar">
        <div class="sidebar-header">
          <a href="index.html" class="sidebar-logo"
            >🚿 Auto<span>Wash</span> Pro</a
          >
          <div class="sidebar-role">Quản trị</div>
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="admin-dashboard.html" class=""
                ><span class="nav-icon">📊</span>Dashboard</a
              >
            </li>
            <li>
              <a href="admin-customers.html" class=""
                ><span class="nav-icon">👥</span>Khách hàng</a
              >
            </li>
            <li>
              <a href="admin-bookings.html"
                ><span class="nav-icon">📅</span>Bookings</a
              >
            </li>
            <li>
              <a href="admin-services.html" class=""
                ><span class="nav-icon">🔧</span>Dịch vụ</a
              >
            </li>
            <li>
              <a href="admin-loyalty-tiers.html" class=""
                ><span class="nav-icon">🏆</span>Hạng TV</a
              >
            </li>
            <li>
              <a href="admin-promotions.html" class=""
                ><span class="nav-icon">🎁</span>Khuyến mãi</a
              >
            </li>
            <li>
              <a href="admin-rewards.html" class=""
                ><span class="nav-icon">🎖️</span>Quà tặng</a
              >
            </li>
            <li>
              <a href="walkin-booking.html"
                ><span class="nav-icon">📝</span>WalkInBooking</a
              >
            </li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <a
            href="#"
            onclick="
              handleLogout();
              return false;
            "
            >🚪 Đăng xuất</a
          >
        </div>
      </aside>
      <main class="main-content">
        <header class="navbar">
          <div class="navbar-left">
            <button type="button" class="sidebar-toggle" aria-label="Menu">
              ☰
            </button>
            <div class="navbar-title"><h2>Khách hàng</h2></div>
          </div>
          <div class="navbar-right">
            <div class="navbar-user">
              <div class="user-avatar">NA</div>
              <div class="user-info">
                <div class="user-name">User</div>
                <div class="user-tier">Manager</div>
              </div>
            </div>
          </div>
        </header>
        <div class="page-content">
          <!-- Cập nhật lại HTML trong admin-customers.html -->
          <div class="filter-bar">
            <input
              type="search"
              id="searchCustomer"
              placeholder="Tìm tên, SĐT, email..."
            />
            <select id="filterTier">
              <!-- Chỉ giữ lại option Mặc định, các option khác sẽ do JS render -->
              <option value="all">Tất cả hạng</option>
            </select>
          </div>
          <div class="card table-wrapper">
            <table class="table" id="customersTable">
              <thead>
                <tr>
                  <th>Tên</th>
                  <th>SĐT</th>
                  <th>Email</th>
                  <th>Hạng</th>
                  <th>Điểm</th>
                  <th>Lượt</th>
                  <th>Chi tiêu</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/mock-api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
