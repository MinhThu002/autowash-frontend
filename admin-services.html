<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dịch vụ - AutoWash Pro</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body data-page="admin-services">
    <div class="app-layout">
      <div class="sidebar-overlay"></div>
      <aside class="sidebar">
        <div class="sidebar-header">
          <a href="index.html" class="sidebar-logo"
            >🚿 Auto<span>Wash</span> Pro</a
          >
          <div class="sidebar-role">Quản trị</div>
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="admin-dashboard.html" class=""
                ><span class="nav-icon">📊</span>Dashboard</a
              >
            </li>
            <li>
              <a href="admin-customers.html" class=""
                ><span class="nav-icon">👥</span>Khách hàng</a
              >
            </li>
            <li>
              <a href="admin-bookings.html" class=""
                ><span class="nav-icon">📅</span>Bookings</a
              >
            </li>
            <li>
              <a href="admin-services.html" class="active"
                ><span class="nav-icon">🔧</span>Dịch vụ</a
              >
            </li>
            <li>
              <a href="admin-loyalty-tiers.html" class=""
                ><span class="nav-icon">🏆</span>Hạng TV</a
              >
            </li>
            <li>
              <a href="admin-promotions.html" class=""
                ><span class="nav-icon">🎁</span>Khuyến mãi</a
              >
            </li>
            <li>
              <a href="admin-rewards.html" class=""
                ><span class="nav-icon">🎖️</span>Quà tặng</a
              >
            </li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <a
            href="#"
            onclick="
              logout();
              return false;
            "
            >🚪 Đăng xuất</a
          >
        </div>
      </aside>
      <main class="main-content">
        <header class="navbar">
          <div class="navbar-left">
            <button type="button" class="sidebar-toggle" aria-label="Menu">
              ☰
            </button>
            <div class="navbar-title"><h2>Dịch vụ</h2></div>
          </div>
          <div class="navbar-right">
            <div class="navbar-user">
              <div class="user-avatar">NA</div>
              <div class="user-info">
                <div class="user-name">User</div>
                <div class="user-tier">Member</div>
              </div>
            </div>
          </div>
        </header>
        <div class="page-content">
          <div class="page-header">
            <h2>Dịch vụ</h2>
            <button class="btn btn-primary" onclick="openAddService()">
              + Thêm dịch vụ
            </button>
          </div>
          <div class="card table-wrapper">
            <table class="table" id="servicesTable">
              <thead>
                <tr>
                  <th>Tên</th>
                  <th>TG</th>
                  <th>Giá</th>
                  <th>Mô tả</th>
                  <th>TT</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="modal-overlay" id="serviceModal">
            <div class="modal">
              <div class="modal-header">
                <h3>Dịch vụ</h3>
                <button class="modal-close" data-modal-close="serviceModal">
                  &times;
                </button>
              </div>
              <form id="serviceForm">
                <div class="modal-body">
                  <input type="hidden" id="serviceId" />
                  <div class="form-group">
                    <label>Tên</label><input id="serviceName" required />
                  </div>
                  <div class="form-group">
                    <label>Thời lượng (phút)</label>
                    <input type="number" id="serviceDuration" required />
                  </div>
                  <div class="form-group">
                    <label>Giá</label
                    ><input type="number" id="servicePrice" required />
                  </div>
                  <div class="form-group">
                    <label>Mô tả</label
                    ><textarea id="serviceDescription"></textarea>
                  </div>
                  <div class="form-group">
                    <label>Trạng thái</label
                    ><select id="serviceActive">
                      <option value="true">Active</option>
                      <option value="false">Inactive</option>
                    </select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-modal-close="serviceModal"
                  >
                    Hủy</button
                  ><button type="submit" class="btn btn-primary">Lưu</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/mock-api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
