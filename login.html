<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - AutoWash Pro</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><h1>🚿 Auto<span>Wash</span> Pro</h1></div>
    <p class="auth-subtitle">Đăng nhập vào tài khoản</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email / Số điện thoại</label>
        <input type="text" id="loginEmail" placeholder="email@example.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Mật khẩu</label>
        <input type="password" id="loginPassword" required>
      </div>
      <div class="form-check">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Ghi nhớ đăng nhập</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
    </form>
    <p class="auth-links">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    <p class="form-hint text-center" style="margin-top:1rem">Demo: customer@mail.com | admin@mail.com | staff@mail.com</p>
  </div>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
