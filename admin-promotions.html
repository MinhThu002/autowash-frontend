<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khuyến mãi - AutoWash Pro</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="admin-promotions">
<div class="app-layout">
  <div class="sidebar-overlay"></div>
  <aside class="sidebar"><div class="sidebar-header"><a href="index.html" class="sidebar-logo">🚿 Auto<span>Wash</span> Pro</a><div class="sidebar-role">Quản trị</div></div><nav class="sidebar-nav"><ul><li><a href="admin-dashboard.html" class=""><span class="nav-icon">📊</span>Dashboard</a></li><li><a href="admin-customers.html" class=""><span class="nav-icon">👥</span>Khách hàng</a></li><li><a href="admin-bookings.html" class=""><span class="nav-icon">📅</span>Bookings</a></li><li><a href="admin-services.html" class=""><span class="nav-icon">🔧</span>Dịch vụ</a></li><li><a href="admin-loyalty-tiers.html" class=""><span class="nav-icon">🏆</span>Hạng TV</a></li><li><a href="admin-promotions.html" class="active"><span class="nav-icon">🎁</span>Khuyến mãi</a></li><li><a href="admin-rewards.html" class=""><span class="nav-icon">🎖️</span>Quà tặng</a></li><li><a href="admin-analytics.html" class=""><span class="nav-icon">📈</span>Analytics</a></li></ul></nav><div class="sidebar-footer"><a href="#" onclick="logout();return false">🚪 Đăng xuất</a></div></aside>
  <main class="main-content">
    <header class="navbar">
      <div class="navbar-left">
        <button type="button" class="sidebar-toggle" aria-label="Menu">☰</button>
        <div class="navbar-title"><h2>Khuyến mãi</h2></div>
      </div>
      <div class="navbar-right">
        <div class="navbar-user">
          <div class="user-avatar">NA</div>
          <div class="user-info"><div class="user-name">User</div><div class="user-tier">Member</div></div>
        </div>
      </div>
    </header>
    <div class="page-content">
<div class="page-header"><h2>Khuyến mãi</h2><button class="btn btn-primary" onclick="openAddPromotion()">+ Thêm KM</button></div>
<div class="card table-wrapper"><table class="table" id="promotionsTable"><thead><tr><th>Title</th><th>Mô tả</th><th>Giảm %</th><th>Bắt đầu</th><th>Kết thúc</th><th>Min tier</th><th>TT</th><th></th></tr></thead><tbody></tbody></table></div>
<div class="modal-overlay" id="promotionModal"><div class="modal"><div class="modal-header"><h3>Khuyến mãi</h3><button class="modal-close" data-modal-close="promotionModal">&times;</button></div>
<form id="promotionForm"><div class="modal-body"><input type="hidden" id="promoId">
<div class="form-group"><label>Title</label><input id="promoName" required></div>
<div class="form-group"><label>Mô tả</label><textarea id="promoDescription"></textarea></div>
<div class="form-group"><label>Giảm % (discount_percent)</label><input type="number" id="promoDiscountValue" min="0" max="100" step="0.1" required></div>
<div class="form-row"><div class="form-group"><label>Từ ngày</label><input type="date" id="promoStart" required></div>
<div class="form-group"><label>Đến ngày</label><input type="date" id="promoEnd" required></div></div>
<div class="form-row"><div class="form-group"><label>Min tier (min_tier_id)</label><select id="promoTier"><option value="all">Tất cả (NULL)</option><option value="1">Member+</option><option value="2">Silver+</option><option value="3">Gold+</option><option value="4">Platinum</option></select></div>
<div class="form-group"><label>Trạng thái</label><select id="promoStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div></div>
</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-modal-close="promotionModal">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div></form></div></div>
</div>
  </main>
</div>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/mock-api.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
