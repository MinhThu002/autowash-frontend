<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - AutoWash Pro</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><h1>🚿 Auto<span>Wash</span> Pro</h1></div>
    <p class="auth-subtitle">Khôi phục mật khẩu</p>
    <p class="form-hint text-center" style="margin-bottom:1.25rem">Nhập email đã đăng ký. Mã OTP sẽ được gửi qua email.</p>
    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" placeholder="email@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Gửi mã OTP</button>
    </form>
    <p class="auth-links"><a href="login.html">← Quay lại đăng nhập</a></p>
  </div>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/mock-api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
