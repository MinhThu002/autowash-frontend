<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch rửa xe hôm nay - AutoWash Pro</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body data-page="staff-schedule">
    <div class="app-layout">
      <div class="sidebar-overlay"></div>
      <aside class="sidebar">
        <div class="sidebar-header">
          <a href="index.html" class="sidebar-logo"
            >🚿 Auto<span>Wash</span> Pro</a
          >
          <div class="sidebar-role">Nhân viên</div>
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="staff-schedule.html" class="active"
                ><span class="nav-icon">📋</span>Lịch hôm nay</a
              >
            </li>
            <li>
              <a href="walkin-booking.html"
                ><span class="nav-icon">📝</span>Walk-in</a
              >
            </li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <a
            href="#"
            onclick="
              handleLogout();
              return false;
            "
            >🚪 Đăng xuất</a
          >
        </div>
      </aside>
      <main class="main-content">
        <header class="navbar">
          <div class="navbar-left">
            <button type="button" class="sidebar-toggle" aria-label="Menu">
              ☰
            </button>
            <div class="navbar-title"><h2>Lịch rửa xe hôm nay</h2></div>
          </div>
          <div class="navbar-right">
            <div class="navbar-user">
              <div class="user-avatar">NA</div>
              <div class="user-info">
                <div class="user-name">User</div>
                <div class="user-tier">Staff</div>
              </div>
            </div>
          </div>
        </header>
        <div class="page-content">
          <div class="page-intro">
            <div>
              <h3 class="page-intro-title" id="scheduleDateTitle">
                Lịch trong ngày
              </h3>
              <p class="text-muted" id="scheduleDateSub">
                Đang tải ngày hôm nay…
              </p>
            </div>
            <div class="page-intro-actions">
              <a href="walkin-booking.html" class="btn btn-primary"
                >+ Walk-in</a
              >
              <button
                type="button"
                class="btn btn-secondary"
                onclick="renderStaffSchedule()"
              >
                Làm mới
              </button>
            </div>
          </div>

          <div class="stats-grid staff-day-stats" id="staffDayStats">
            <div class="stat-card compact">
              <div class="stat-label">Tổng lịch</div>
              <div class="stat-value" id="stTotal">0</div>
            </div>
            <div class="stat-card compact">
              <div class="stat-label">Chờ xử lý</div>
              <div class="stat-value" id="stPending">0</div>
            </div>
            <div class="stat-card compact">
              <div class="stat-label">Đã xác nhận</div>
              <div class="stat-value" id="stConfirmed">0</div>
            </div>
            <div class="stat-card compact">
              <div class="stat-label">Hoàn thành</div>
              <div class="stat-value" id="stCompleted">0</div>
            </div>
          </div>

          <div class="schedule-timeline" id="scheduleList"></div>
        </div>
      </main>
    </div>
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/mock-api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
