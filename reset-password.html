<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu - AutoWash Pro</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><h1>🚿 Auto<span>Wash</span> Pro</h1></div>
    <p class="auth-subtitle">Đặt lại mật khẩu</p>
    <p class="form-hint text-center" style="margin-bottom:1.25rem">Nhập mã OTP từ email và mật khẩu mới.</p>
    <form id="resetPasswordForm">
      <div class="form-group">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" placeholder="email@example.com" required>
      </div>
      <div class="form-group">
        <label for="resetOtp">Mã OTP</label>
        <input type="text" id="resetOtp" placeholder="6 chữ số" maxlength="6" required>
      </div>
      <div class="form-group">
        <label for="resetPassword">Mật khẩu mới</label>
        <input type="password" id="resetPassword" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="resetConfirm">Xác nhận mật khẩu</label>
        <input type="password" id="resetConfirm" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Đặt lại mật khẩu</button>
    </form>
    <p class="auth-links"><a href="forgot-password.html">Gửi lại OTP</a> · <a href="login.html">Đăng nhập</a></p>
  </div>
  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/mock-api.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const email = new URLSearchParams(window.location.search).get('email');
      if (email) document.getElementById('resetEmail').value = email;
    });
  </script>
</body>
</html>
